name: ai_assistant
description: "On-Device Gemma Assistant — private, offline-first chat. Android-first."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Stack & target versions are governed by specs/001-model-download-chat/research.md.
# flutter_gemma is permitted to be imported ONLY in lib/infrastructure/gemma/ (Principle VII).
#
# On stable Flutter 3.44.1 / Dart 3.12.1 the research.md pins resolve natively — the earlier
# prerelease-SDK deviations have been removed:
#   * flutter_gemma ^0.15.0 — native Gemma 4 support (ModelType.gemma4 + .litertlm). Requires Dart
#     >=3.10.7 (via dart_sentencepiece_tokenizer). Imported ONLY in the GemmaService seam.
#   * drift / drift_dev ^2.33.0, drift_flutter ^0.3.0 — ride sqlite3 ^3.x (which flutter_gemma 0.15
#     also requires), so no sqlite3 dependency_override is needed.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Pure-Dart annotations (@immutable) for the Flutter-free domain layer.
  meta: ^1.17.0

  # Model runtime (LiteRT-LM / MediaPipe) — isolated behind GemmaService (R1).
  # ^0.15.0 for native Gemma 4 (ModelType.gemma4 + .litertlm), which arrived in 0.14.1+.
  # NOTE: a 0.16.x experiment (audit 2026-06-08) regressed image input on the A34 — its new native
  # LiteRT-LM (v0.12.0-a) failed to load the vision-enabled model, flipping capabilities to text-only
  # and surfacing "image removed — this model does not accept images". Reverted to ^0.15.0 (verified
  # 0.15.3). See specs/002-image-input-vision/diagnosis-and-audit-2026-06-08.md.
  flutter_gemma: ^0.15.0

  # One-time model download under an Android foreground service (R2).
  background_downloader: ^9.5.5

  # Reactive, type-safe SQLite persistence (R3). 2.33/0.3 ride sqlite3 ^3.x (shared with gemma).
  drift: ^2.33.0
  drift_flutter: ^0.3.0

  # State management — manual Notifier, code-gen optional (R5).
  flutter_riverpod: 3.3.1

  # Device preflight: physicalRamSize + supportedAbis (R4).
  device_info_plus: ^13.1.0

  # Image acquisition — camera capture + Android Photo Picker for the library, behind the
  # MediaPickerService seam (002 R2). Imported ONLY in lib/infrastructure/media/ (Principle VII
  # discipline, enforced by tool/check_plugin_seam.sh). Pick-time downscale keeps stored copies
  # modest and under flutter_gemma's 10 MB image cap.
  image_picker: ^1.2.0

  # Camera permission status/request + openAppSettings() for the permanently-denied path, behind
  # the MediaPermissionService seam (002 R3). The photo library is permissionless on modern Android
  # (the Photo Picker grants per-image access). Imported ONLY in lib/infrastructure/media/.
  permission_handler: ^12.0.0

  # App-private documents directory (R2/R3).
  path_provider: ^2.1.5

  # Offline-bundled fonts; runtime fetching disabled in main.dart (R6).
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # THROWAWAY (003 Phase 0 spike): on-device audio-grounding verification only
  # (integration_test/spike_audio_grounding_test.dart). Remove with the spike.
  integration_test:
    sdk: flutter

  # drift codegen (run: dart run build_runner build).
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

  # Direct raw-SQL access for the v1→v2 migration test (seed a v1 schema by hand). Already resolved
  # transitively via drift; pinned here only so the test may import it without a lint.
  sqlite3: ^3.3.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # Offline-bundled fonts (R6) — all SIL OFL 1.1, each shipping its OFL.txt next to it.
  #   * Space Grotesk  — UI / body (the single variable TTF covers weights 400–700 via the
  #                      wght axis; no per-weight statics needed).
  #   * Space Mono     — spec / metadata labels (uppercase, letter-spaced).
  #   * Pixelify Sans  — the dot-matrix / pixel DISPLAY face (numerals + wordmark), exposed via
  #                      AppText.dotMatrix(). design-system §3 leaves the specific dot face open;
  #                      research R6 suggested "MatrixSans" — Pixelify Sans is the bundled OFL
  #                      equivalent (real name kept; not renamed, per the OFL RFN clause).
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: Pixelify Sans
      fonts:
        - asset: assets/fonts/PixelifySans-Variable.ttf
