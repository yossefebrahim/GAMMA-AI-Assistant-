name: Release

# Builds the Android release artifacts and publishes a GitHub Release when a
# version tag (v*) is pushed. Manual dispatch builds the artifacts for download
# without creating a Release.
#
# IMPORTANT — signing: android/app/build.gradle.kts currently signs release builds
# with the DEBUG keystore (see the TODO there). These artifacts are therefore NOT
# Play-Store-uploadable as-is. To ship for real, add a release keystore + a
# `key.properties` (via secrets) and a Play upload step where marked below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.1"
  FLUTTER_CHANNEL: stable

jobs:
  release:
    name: Build & publish Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # --- (Optional) real signing goes here -----------------------------------
      # - name: Restore release keystore
      #   run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      # - name: Write key.properties
      #   run: |
      #     cat > android/key.properties <<EOF
      #     storeFile=release.keystore
      #     storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
      #     keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
      #     keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
      #     EOF
      # -------------------------------------------------------------------------

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Stage artifacts
        id: stage
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ai_assistant-${version}-arm64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/ai_assistant-${version}.aab"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.apk dist/*.aab \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      # --- (Optional) Play Store internal track upload -------------------------
      # - name: Upload to Play (internal)
      #   uses: r0adkll/upload-google-play@<pinned-sha>
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.example.ai_assistant
      #     releaseFiles: dist/*.aab
      #     track: internal
      # -------------------------------------------------------------------------
