# Static analysis for the On-Device Gemma Assistant.
#
# PLUGIN-SEAM INVARIANT (Constitution Principle VII): `package:flutter_gemma` may be imported
# ONLY from lib/infrastructure/gemma/. Dart's built-in lints cannot path-scope an import ban, so
# the invariant is enforced by tool/check_plugin_seam.sh (run in CI / pre-commit). Keep that guard
# green — domain, data, and presentation code must depend on the GemmaService interface, never the
# plugin directly.
include: package:flutter_lints/flutter.yaml

analyzer:
  # drift + (optional) riverpod code generation emit *.g.dart / *.drift.dart; don't lint generated
  # output, but DO let the analyzer see it for type resolution.
  exclude:
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - "**/*.freezed.dart"
    # The sanctioned `flutter drive` vehicle for device-stateful runs (NEVER `flutter test
    # integration_test/...`, which uninstalls the app and wipes the model + DB — 003 spike
    # incident log). Its `integration_test` import only resolves when a drive target temporarily
    # re-adds that dev-dependency; keep the file, skip the analyzer.
    - "test_driver/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat the easy correctness/clarity wins as warnings-as-errors-worthy signals.
    always_use_package_imports: warning

linter:
  rules:
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - avoid_print
    - unawaited_futures
    - directives_ordering
    - always_use_package_imports
